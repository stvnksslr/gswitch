[package]
name = "gswitch"
version = "0.1.0"
edition = "2024"
description = "A fast, lightweight CLI tool for managing and automatically switching git profiles based on project context."
license = "MIT"
repository = "https://github.com/stvnksslr/gswitch"
readme = "README.md"

[[bin]]
name = "gsw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"

[profile.release]
lto = true
strip = true
codegen-units = 3

[profile.dev]
codegen-units = 1

[profile.test]
codegen-units = 1
